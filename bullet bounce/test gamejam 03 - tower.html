
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bullet Hell</title>
  <style>
    html, body {
      margin: 0;
      background: #080b18;
      color: white;
      font: 14px system-ui;
    }

    body {
      padding: 0;
    }

    .toolbar {
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    canvas {
      display: block;
      width: min(900px, 96vw);
      height: auto;
      margin: 0 auto;
      border: 1px solid #536080;
      background: #101a3c;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>Bullet Hell</strong>
    <label for="bg">Sfondo:</label>
    <select id="bg">
      <option value="forest">Foresta</option>
    </select>
    <button id="restart">Ricomincia</button>
    <button id="bounce back">Bounce Back</button>
    <span id="score">Punti: 0</span>
    <span id="lives">Vite: 5</span>
    <span id="level">Livello: 1 | Superati: 0</span>
    <span id="powerup-status">Power-up: nessuno</span>
  </div>

  <canvas id="game" width="900" height="506"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const bounceBackButton = document.getElementById('bounce back');
    const forestImage = new Image();
    forestImage.src = 'forest.jpg';
    const godmodeImage = new Image();
    godmodeImage.src = 'godmode.png';
    const sandevistanImage = new Image();
    sandevistanImage.src = 'sandevistan.png';

    const keys = new Set();
    const mouse = { x: 450, y: 0 };
    const POWERUP_DURATION = 60 * 5;
    let player, bullets, shots, enemies, score, tick, lives, level, enemiesToSpawn, spawnCooldown;
    let powerups, powerupSpawnCooldown, godmodeTicks, sandevistanTicks;
    let invulnerableTicks, hitEffectStartedAt, levelMessage, levelMessageTicks, over;

    function updateLevelDisplay() {
      document.querySelector('#level').textContent = `Livello: ${level} | Superati: ${level - 1}`;
    }

    function startLevel() {
      enemies = [];
      bullets = [];
      shots = [];
      powerups = [];
      enemiesToSpawn = level * 10;
      spawnCooldown = 0;
    }

    function updatePowerupStatus() {
      const activeEffects = [];
      if (godmodeTicks > 0) activeEffects.push(`Godmode ${Math.ceil(godmodeTicks / 60)}s`);
      if (sandevistanTicks > 0) activeEffects.push(`Sandevistan ${Math.ceil(sandevistanTicks / 60)}s`);
      document.querySelector('#powerup-status').textContent =
        activeEffects.length ? `Power-up: ${activeEffects.join(' / ')}` : 'Power-up: nessuno';
    }

    function drawPowerup(powerup) {
      const image = powerup.type === 'godmode' ? godmodeImage : sandevistanImage;
      ctx.save();
      ctx.shadowColor = '#35ff72';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(powerup.x, powerup.y, 19, 0, Math.PI * 2);
      ctx.fillStyle = '#20d957';
      ctx.fill();
      ctx.shadowBlur = 0;

      ctx.save();
      ctx.beginPath();
      ctx.arc(powerup.x, powerup.y, 14, 0, Math.PI * 2);
      ctx.clip();
      if (image.complete && image.naturalWidth > 0) {
        ctx.drawImage(image, powerup.x - 14, powerup.y - 14, 28, 28);
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 16px system-ui';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(powerup.type === 'godmode' ? 'G' : 'S', powerup.x, powerup.y);
      }
      ctx.restore();

      ctx.beginPath();
      ctx.arc(powerup.x, powerup.y, 19, 0, Math.PI * 2);
      ctx.strokeStyle = '#b7ffc9';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#b7ffc9';
      ctx.font = 'bold 11px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(powerup.type === 'godmode' ? 'GODMODE' : 'SANDY', powerup.x, powerup.y + 32);
      ctx.restore();
    }

    function reset() {
      player = { x: 450, y: 440, r: 10, cooldown: 0, aimAngle: -Math.PI / 2 };
      score = 0;
      tick = 0;
      lives = 5;
      level = 1;
      powerupSpawnCooldown = 60 * 5;
      godmodeTicks = 0;
      sandevistanTicks = 0;
      invulnerableTicks = 0;
      hitEffectStartedAt = null;
      levelMessage = '';
      levelMessageTicks = 0;
      over = false;
      startLevel();
      bounceBackButton.disabled = true;
      document.querySelector('#score').textContent = 'Punti: 0';
      document.querySelector('#lives').textContent = `Vite: ${lives}`;
      updateLevelDisplay();
      updatePowerupStatus();
    }

    document.querySelector('#restart').onclick = reset;

    bounceBackButton.onclick = () => {
      if (!over || lives === 0) return;
      lives--;
      level = Math.max(1, level - 1);
      document.querySelector('#lives').textContent = `Vite: ${lives}`;
      updateLevelDisplay();
      startLevel();
      invulnerableTicks = 90;
      hitEffectStartedAt = null;
      levelMessage = 'BACK';
      levelMessageTicks = 120;
      over = false;
      bounceBackButton.disabled = true;
    };

    canvas.addEventListener('pointermove', e => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - rect.left) * canvas.width / rect.width;
      mouse.y = (e.clientY - rect.top) * canvas.height / rect.height;
    });

    window.onkeydown = e => {
      keys.add(e.key.toLowerCase());
      if (e.key.startsWith('Arrow') || e.key === ' ') e.preventDefault();
      if (over && e.key === 'Enter') reset();
    };

    window.onkeyup = e => keys.delete(e.key.toLowerCase());

    function drawCircle(x, y, r, color, outline = false) {
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      if (outline) {
        
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }
    /**var canvas = document.createElement('canvas');
    var ctx = canvas.getContext('2d');
    canvas.width=300
    canvas.height=234
    ctx.drawImage(img, 0, 0, 300, 234);
    document.body.appendChild(canvas);**/

    function loop() {
      tick++;
      if (levelMessageTicks > 0) levelMessageTicks--;
      const effectProgress = hitEffectStartedAt === null
        ? 1
        : Math.min((performance.now() - hitEffectStartedAt) / 700, 1);
      if (effectProgress === 1) hitEffectStartedAt = null;
      const zoom = 1 + 0.1 * Math.sin(effectProgress * Math.PI);
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(zoom, zoom);
      ctx.translate(-canvas.width / 2, -canvas.height / 2);

      if (forestImage.complete && forestImage.naturalWidth > 0) {
        ctx.drawImage(forestImage, 0, 0, canvas.width, canvas.height);
      } else {
        ctx.fillStyle = '#101a3c';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      if (!over) {
        const timeFrozen = sandevistanTicks > 0;
        const godmodeActive = godmodeTicks > 0;
        if (invulnerableTicks > 0) invulnerableTicks--;
        if (godmodeTicks > 0) godmodeTicks--;
        if (sandevistanTicks > 0) sandevistanTicks--;
        const baseSpeed = keys.has('shift') ? 2.5 : 4;
        const speed = baseSpeed * (1 + (5 - lives) * 0.2);
        player.x += ((keys.has('d') || keys.has('arrowright')) - (keys.has('a') || keys.has('arrowleft'))) * speed;
        player.y += ((keys.has('s') || keys.has('arrowdown')) - (keys.has('w') || keys.has('arrowup'))) * speed;
        player.x = Math.max(10, Math.min(890, player.x));
        player.y = Math.max(10, Math.min(496, player.y));
        player.aimAngle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

        if (player.cooldown) player.cooldown--;
        if (keys.has(' ') && !player.cooldown) {
          const vx = Math.cos(player.aimAngle) * 8;
          const vy = Math.sin(player.aimAngle) * 8;
          shots.push({ x: player.x + Math.cos(player.aimAngle) * 12, y: player.y + Math.sin(player.aimAngle) * 12, vx, vy });
          player.cooldown = 10;
        }

        if (!timeFrozen) {
          if (powerupSpawnCooldown > 0) powerupSpawnCooldown--;
          if (powerupSpawnCooldown === 0 && powerups.length < 2) {
            powerups.push({
              x: 40 + Math.random() * 820,
              y: 40 + Math.random() * 420,
              type: Math.random() < 0.5 ? 'godmode' : 'sandevistan'
            });
            powerupSpawnCooldown = 60 * (10 + Math.floor(Math.random() * 6));
          }

          if (spawnCooldown > 0) spawnCooldown--;
          if (enemiesToSpawn > 0 && spawnCooldown === 0) {
            enemies.push({ x: 20 + Math.random() * 860, y: -12, fire: 60 });
            enemiesToSpawn--;
            spawnCooldown = 65;
          }

          enemies.forEach(e => {
            e.y += 1.4;
            if (e.y > 518) {
              e.y = -12;
              e.x = 20 + Math.random() * 860;
            }
            e.fire--;
            if (e.fire <= 0) {
              const a = Math.atan2(player.y - e.y, player.x - e.x);
              bullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 2, vy: Math.sin(a) * 2 });
              e.fire = 90;
            }
          });
          bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
        }

        shots.forEach(s => { s.x += s.vx; s.y += s.vy; });

        for (const powerup of powerups) {
          if (Math.hypot(player.x - powerup.x, player.y - powerup.y) < player.r + 18) {
            if (powerup.type === 'godmode') godmodeTicks = POWERUP_DURATION;
            else sandevistanTicks = POWERUP_DURATION;
            powerup.collected = true;
          }
        }
        powerups = powerups.filter(powerup => !powerup.collected);

        for (const e of enemies) {
          const si = shots.findIndex(s => Math.hypot(s.x - e.x, s.y - e.y) < 17);
          if (si >= 0) {
            shots.splice(si, 1);
            e.dead = true;
            score += 10;
            document.querySelector('#score').textContent = `Punti: ${score}`;
          }
        }

        const hit = enemies.some(e => !e.dead && Math.hypot(player.x - e.x, player.y - e.y) < 22) ||
          bullets.some(b => Math.hypot(player.x - b.x, player.y - b.y) < 15);
        if (hit && invulnerableTicks === 0 && !godmodeActive && godmodeTicks === 0) {
          over = true;
          bounceBackButton.disabled = lives === 0;
          hitEffectStartedAt = performance.now();
        }

        enemies = enemies.filter(e => !e.dead);
        shots = shots.filter(s => s.y > -10 && s.y < 516 && s.x > -10 && s.x < 910);
        bullets = bullets.filter(b => b.y < 520 && b.x > -10 && b.x < 910);
        updatePowerupStatus();

        if (!over && enemiesToSpawn === 0 && enemies.length === 0) {
          level++;
          updateLevelDisplay();
          startLevel();
          levelMessage = 'BOUNCE';
          levelMessageTicks = 120;
        }
      }

      shots.forEach(s => drawCircle(s.x, s.y, 4, '#8ef7ff'));
      bullets.forEach(b => drawCircle(b.x, b.y, 5, '#ff637d'));
      enemies.forEach(e => drawCircle(e.x, e.y, 13, '#ff4968'));
      powerups.forEach(drawPowerup);
      if (invulnerableTicks === 0 || tick % 8 < 4) {
        if (godmodeTicks > 0) {
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.r + 7, 0, Math.PI * 2);
          ctx.strokeStyle = '#35ff72';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.moveTo(player.x, player.y);
        ctx.lineTo(player.x + Math.cos(player.aimAngle) * 18, player.y + Math.sin(player.aimAngle) * 18);
        ctx.strokeStyle = '#68f0ff';
        ctx.lineWidth = 3;
        ctx.stroke();
        drawCircle(player.x, player.y, player.r, '#68f0ff', true);
      }

      if (over) {
        ctx.fillStyle = 'rgba(0,0,0,.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.font = 'bold 28px system-ui';
        ctx.fillText('Game over', 450, 245);
        ctx.font = '16px system-ui';
        ctx.fillText(lives > 0 ? 'Premi Bounce Back per continuare' : 'Nessuna vita: premi Ricomincia', 450, 275);
      }
      if (levelMessageTicks > 0) {
        ctx.fillStyle = '#ffe36e';
        ctx.textAlign = 'center';
        ctx.font = 'bold 30px system-ui';
        ctx.fillText(levelMessage, 450, 70);
      }

      ctx.restore();
      const redTint = (5 - lives) * 0.1;
      if (redTint > 0) {
        ctx.fillStyle = `rgba(255, 0, 0, ${redTint})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      if (sandevistanTicks > 0) {
        ctx.fillStyle = 'rgba(0, 255, 255, 0.2)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      requestAnimationFrame(loop);
    }

    reset();
    loop();
  </script>
</body>
</html>
